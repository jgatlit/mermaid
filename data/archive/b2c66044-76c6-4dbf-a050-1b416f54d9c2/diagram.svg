<svg id="mermaid-server-3" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 522 450" style="max-width: 522px;" role="graphics-document document" aria-roledescription="pie"><style>#mermaid-server-3{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-server-3 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-server-3 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-server-3 .error-icon{fill:#552222;}#mermaid-server-3 .error-text{fill:#552222;stroke:#552222;}#mermaid-server-3 .edge-thickness-normal{stroke-width:1px;}#mermaid-server-3 .edge-thickness-thick{stroke-width:3.5px;}#mermaid-server-3 .edge-pattern-solid{stroke-dasharray:0;}#mermaid-server-3 .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-server-3 .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-server-3 .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-server-3 .marker{fill:#333333;stroke:#333333;}#mermaid-server-3 .marker.cross{stroke:#333333;}#mermaid-server-3 svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-server-3 p{margin:0;}#mermaid-server-3 .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#mermaid-server-3 .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#mermaid-server-3 .pieTitleText{text-anchor:middle;font-size:25px;fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid-server-3 .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#333;font-size:17px;}#mermaid-server-3 .legend text{fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#mermaid-server-3 :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g transform="translate(225,225)"><circle cx="0" cy="0" r="186" class="pieOuterCircle"></circle><path d="M0,-185A185,185,0,1,1,0,185A185,185,0,1,1,0,-185Z" fill="#ECECFF" class="pieCircle"></path><text transform="translate(-5.312139069761142e-14,138.75)" style="text-anchor: middle;" class="slice">100%</text><text x="0" y="-200" class="pieTitleText"></text><g class="legend" transform="translate(216,-11)"><rect width="18" height="18" style="fill: #ECECFF; stroke: #ECECFF;"></rect><text x="22" y="14">A</text></g></g></svg>