<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
      }
      /* Mermaid measures against the live layout, so the container must be a real,
         generously sized box. A cramped container is itself a source of wrong
         geometry — the class of bug this whole backend exists to remove. */
      #host {
        width: 1600px;
        font-family: 'trebuchet ms', verdana, arial, sans-serif;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <script type="module">
      // Loaded over file:// from the built dist next door, so the relative ./chunks/
      // imports inside the bundle resolve exactly as they do in a browser build.
      import mermaid from '/packages/mermaid/dist/mermaid.esm.min.mjs';

      const status = { ready: false, error: null, layouts: [], iconPacks: [] };
      window.__mermaidStatus = () => status;

      async function boot() {
        try {
          const elk = await import('/packages/mermaid-layout-elk/dist/mermaid-layout-elk.esm.min.mjs')
            .then((m) => m.default ?? m)
            .catch(() => null);
          if (elk) {
            mermaid.registerLayoutLoaders(Array.isArray(elk) ? elk : [elk]);
            status.layouts = (Array.isArray(elk) ? elk : [elk]).map((l) => l.name);
          }
        } catch (e) {
          // layouts are optional — dagre still works
        }

        try {
          const packs = ['logos', 'mdi', 'fa6-solid', 'fa6-brands'];
          mermaid.registerIconPacks(
            packs.map((name) => ({
              name,
              loader: () =>
                fetch(`/icons/${name}.json`).then((r) => {
                  if (!r.ok) throw new Error(`icon pack ${name}: ${r.status}`);
                  return r.json();
                }),
            }))
          );
          status.iconPacks = packs;
        } catch (e) {
          // icons optional
        }

        status.ready = true;
      }

      window.__render = async (id, text, config) => {
        if (!status.ready) throw new Error('mermaid not ready');
        try {
          mermaid.initialize(config);
          const out = await mermaid.render(id, text, document.getElementById('host'));
          return { svg: out.svg, diagramType: out.diagramType ?? null };
        } finally {
          try {
            mermaid.mermaidAPI.reset();
          } catch (e) {
            /* reset is best-effort */
          }
          const host = document.getElementById('host');
          if (host) host.innerHTML = '';
          // mermaid leaves the measuring element behind on some diagram types;
          // left alone they accumulate and eventually skew layout.
          document.querySelectorAll('[id^="d' + id + '"], #' + id).forEach((n) => n.remove());
        }
      };

      boot().catch((e) => {
        status.error = String(e);
      });
    </script>
  </body>
</html>
